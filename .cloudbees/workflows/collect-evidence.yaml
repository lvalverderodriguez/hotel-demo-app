# Application workflow: .cloudbees/workflows/collect-evidence.yaml
# Reusable workflow. Reads the labels, test results and security scan results of the
# run that PUBLISHED an artifact and publishes them as evidence items on the calling run.
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: collect-evidence

on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
        description: ID of the artifact version being deployed
      publish-component-id:
        type: string
        required: true
        description: ID of the component whose run published the artifact
      publish-run-id:
        type: string
        required: true
        description: ID of the run that published the artifact

jobs:
  evidence:
    permissions:
      id-token: read
    steps:
      - id: artifact
        name: Get artifact details
        uses: cloudbees-io/get-artifact-details@v1
        with:
          artifact-id: ${{ inputs.artifact-id }}

      - id: collect
        name: Collect labels, test results and security scans from the publish run
        uses: docker://alpine:3.20
        shell: sh
        env:
          API_URL: ${{ cloudbees.api.url }}
          API_TOKEN: ${{ cloudbees.api.token }}
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          ARTIFACT_VERSION: ${{ steps.artifact.outputs.version }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.digest }}
          COMPONENT_ID: ${{ inputs.publish-component-id }}
          RUN_ID: ${{ inputs.publish-run-id }}
        run: |
          set -eu

          is_uuid() { printf '%s' "$1" | grep -Eq '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'; }
          for pair in "artifact-id:$ARTIFACT_ID" "publish-component-id:$COMPONENT_ID" "publish-run-id:$RUN_ID"; do
            is_uuid "${pair#*:}" || { echo "Invalid ${pair%%:*}: a UUID is expected" >&2; exit 1; }
          done

          apk add --no-cache curl jq >/dev/null
          BASE="$API_URL/v4/components/$COMPONENT_ID/runs/$RUN_ID"
          api() { curl -fsS -H "Authorization: Bearer $API_TOKEN" -H "Accept: application/json" "$BASE/$1"; }

          api artifacts > /tmp/artifacts.json
          api test-results > /tmp/test-results.json
          api security-results > /tmp/security-results.json

          # 1. Labels of the artifact (also proves the artifact belongs to the publish run)
          ART=$(jq -c --arg id "$ARTIFACT_ID" '
            (if type=="array" then . else (.artifacts // .items // []) end)
            | map(select((.id // .artifactId // .artifact_id // "") == $id))
            | .[0] // empty' /tmp/artifacts.json)
          if [ -z "$ART" ]; then
            echo "Artifact $ARTIFACT_ID was not published by run $RUN_ID of component $COMPONENT_ID" >&2
            exit 1
          fi
          LABELS=$(printf '%s' "$ART" | jq -r '
            (.labels // .label // [])
            | (if type=="array" then map(if type=="object" then (.name // tostring) else tostring end) else [tostring] end)
            | if length==0 then "none" else join(", ") end')

          {
            echo "## Artifact and labels"
            echo
            echo "- Name: $ARTIFACT_NAME"
            echo "- Version: $ARTIFACT_VERSION"
            echo "- Location: $ARTIFACT_URL"
            echo "- Digest: $ARTIFACT_DIGEST"
            echo "- Artifact ID: $ARTIFACT_ID"
            echo "- Published by run: $RUN_ID (component $COMPONENT_ID)"
            echo "- Labels: $LABELS"
          } > "$CLOUDBEES_OUTPUTS/labels"

          # 2. Test results (the API returns pre-signed download URLs: keep only the file
          #    names, never the signed URLs)
          FILES=$(jq -r '.. | strings | select(test("^https?://"))' /tmp/test-results.json \
            | sed 's/[?#].*//' | awk -F/ '{print $NF}' | sort -u)
          COUNT=$(printf '%s' "$FILES" | grep -c . || true)
          {
            echo "## Test results"
            echo
            echo "- Result files published by run $RUN_ID: $COUNT"
            if [ "$COUNT" -eq 0 ]; then
              echo "- WARNING: no test results were published by the run"
            else
              printf '%s\n' "$FILES" | head -n 20 | sed 's/^/  - /'
            fi
          } > "$CLOUDBEES_OUTPUTS/tests"

          # 3. Security scan results
          {
            echo "## Security scans"
            echo
            echo "Findings returned for run $RUN_ID (first page of results only):"
            echo
            jq -r '
              (if type=="array" then . else (.results // .findings // .items // []) end) as $f
              | "- Total: \($f | length)",
                ($f | map((.severity // "UNKNOWN") | tostring | ascii_upcase)
                    | group_by(.) | map("- \(.[0]): \(length)") | .[])' /tmp/security-results.json
          } > "$CLOUDBEES_OUTPUTS/security"

      - name: Publish evidence - artifact and labels
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.labels }}

      - name: Publish evidence - test results
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.tests }}

      - name: Publish evidence - security scans
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.security }}
