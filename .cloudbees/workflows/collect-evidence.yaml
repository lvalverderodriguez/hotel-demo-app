# Application workflow: .cloudbees/workflows/collect-evidence.yaml
# Reusable workflow. Publishes the artifact details and its labels as an evidence item
# on the calling run. Calls the Platform API directly (no get-artifact-details action).
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: collect-evidence

on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
        description: ID of the artifact version being deployed

jobs:
  evidence:
    permissions:
      id-token: read
    steps:
      - id: artifact
        name: Get artifact details (Platform API)
        # Same image the get-artifact-details action uses (it ships curl and jq)
        uses: docker://public.ecr.aws/l7o7z1g8/actions/cb-utils:main-0.1.59
        shell: sh
        env:
          JWT: ${{ cloudbees.api.token }}
          URL: ${{ cloudbees.api.url }}
          INPUT_ARTIFACT_ID: ${{ inputs.artifact-id }}
        run: |
          set -eu
          printf '%s' "$INPUT_ARTIFACT_ID" | grep -Eq '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$' \
            || { echo "Invalid artifact-id: a UUID is expected" >&2; exit 1; }

          response=$(curl --silent --show-error --fail-with-body \
            -X GET "$URL/v3/artifactinfos/$INPUT_ARTIFACT_ID" \
            -H "Authorization: Bearer $JWT" \
            -H 'Content-Type: application/json') || {
              echo "Platform API call failed with error: '$response'" >&2
              exit 1
            }

          echo "$response" | jq .

          printf %s "$(echo "$response" | jq -r '.name // empty')"    > "$CLOUDBEES_OUTPUTS/name"
          printf %s "$(echo "$response" | jq -r '.version // empty')" > "$CLOUDBEES_OUTPUTS/version"
          printf %s "$(echo "$response" | jq -r '.url // empty')"     > "$CLOUDBEES_OUTPUTS/url"
          printf %s "$(echo "$response" | jq -r '.digest // empty')"  > "$CLOUDBEES_OUTPUTS/digest"
          printf %s "$(echo "$response" | jq -c .)"                   > "$CLOUDBEES_OUTPUTS/raw_artifact_data"

      - id: collect
        name: Build the artifact and labels evidence
        uses: docker://alpine:3.20
        shell: sh
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          ARTIFACT_VERSION: ${{ steps.artifact.outputs.version }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.digest }}
          RAW_ARTIFACT_DATA: ${{ steps.artifact.outputs.raw_artifact_data }}
        run: |
          set -eu
          apk add --no-cache jq >/dev/null

          is_uuid() { printf '%s' "$1" | grep -Eq '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$'; }
          is_uuid "$ARTIFACT_ID" || { echo "Invalid artifact-id: a UUID is expected" >&2; exit 1; }

          # Labels come from the artifact info (Platform API)
          LABELS=$(printf '%s' "$RAW_ARTIFACT_DATA" | jq -r '
            (.labels // [])
            | (if type=="array" then map(if type=="object" then (.name // tostring) else tostring end) else [tostring] end)
            | if length==0 then "none" else join(", ") end')

          {
            echo "## Artifact and labels"
            echo
            echo "- Name: $ARTIFACT_NAME"
            echo "- Version: $ARTIFACT_VERSION"
            echo "- Location: $ARTIFACT_URL"
            echo "- Digest: $ARTIFACT_DIGEST"
            echo "- Artifact ID: $ARTIFACT_ID"
            echo "- Labels: $LABELS"
          } > "$CLOUDBEES_OUTPUTS/labels"

      - name: Publish evidence - artifact and labels
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.labels }}
