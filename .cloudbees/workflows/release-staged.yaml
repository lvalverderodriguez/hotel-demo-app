# Application workflow: .cloudbees/workflows/release-staged.yaml
# Staged release workflow (run from an application release; receives the release manifest):
#   Evidence -> Approval -> Production
# Component agnostic: every component and artifact flagged deploy=true in the manifest
# is listed in the evidence, and the deployer workflow deploys whatever the manifest holds.
# Requires the application's deployer workflow (.cloudbees/workflows/deployer.yaml),
# which Unify can generate for you from Applications > Workflows.
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: release-staged

on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: Release manifest (JSON) with the artifact versions to deploy
      approver:
        type: string
        required: false
        default: lvalverderodriguez@cloudbees.com
        description: Release manager who approves the deployment (user ID or e-mail address)
  workflow_call:
    inputs:
      manifest:
        type: string
        required: true
        description: Release manifest (JSON) with the artifact versions to deploy
      approver:
        type: string
        required: false
        default: lvalverderodriguez@cloudbees.com
        description: Release manager who approves the deployment (user ID or e-mail address)

metadata:
  stages/v1alpha1:
    - name: Evidence
      jobs:
        - evidence
    - name: Approval
      jobs:
        - release-approval
    - name: Production
      jobs:
        - deploy-production

jobs:
  evidence:
    # The PAT secret lives in this environment, so the job must run in it to read it
    environment: pro-lola
    steps:
      - id: collect
        name: Build the evidence from the release manifest
        # Image with curl and jq (the one the get-artifact-details action uses)
        uses: docker://public.ecr.aws/l7o7z1g8/actions/cb-utils:main-0.1.59
        shell: sh
        env:
          MANIFEST: ${{ inputs.manifest }}
          JWT: ${{ cloudbees.api.token }}
          URL: ${{ cloudbees.api.url }}
          # Personal access token for the v4 API (secret of the pro-lola environment)
          PAT: ${{ secrets.PAT }}
          # Base URL of the Unify UI, including the top-level organization slug
          UNIFY_UI_URL: https://cloudbees.io/cloudbees-support
        run: |
          set -eu
          printf '%s' "$MANIFEST" > /tmp/manifest.json
          jq -e . /tmp/manifest.json >/dev/null || { echo "The manifest is not valid JSON" >&2; exit 1; }

          # Manifest shape: { "<component>": { "deploy": bool, "id": "<component id>",
          #                                    "<artifact>": { "deploy": bool, "id", "name", "version", "url", "digest" } } }
          jq -r 'to_entries[]
            | select(.value | type == "object" and .deploy == true)
            | .key as $comp | .value as $c
            | $c | to_entries[]
            | select(.value | type == "object")
            | select(.value.deploy != false)
            | .key as $k | .value as $a
            | [$comp, ($a.name // $k), ($a.version // "n/a"), ($a.url // "n/a"),
               ($a.digest // "n/a"), ($a.id // "n/a"), ($c.id // "n/a")] | @tsv' /tmp/manifest.json > /tmp/artifacts.tsv

          COUNT=$(wc -l < /tmp/artifacts.tsv | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "The manifest has no artifact flagged deploy=true" >&2
            exit 1
          fi

          echo "## Artifacts to deploy: $COUNT" > /tmp/evidence.md
          echo >> /tmp/evidence.md
          echo "## Raw artifact info (Platform API /v3/artifactinfos)" > /tmp/raw.md
          echo >> /tmp/raw.md
          echo "## Test results of the publishing runs (Platform API v4)" > /tmp/tests.md
          echo >> /tmp/tests.md
          echo "## Security results of the publishing runs (Platform API v4)" > /tmp/security.md
          echo >> /tmp/security.md

          # api_fetch <path>: GET a v4 path authenticated with the PAT (the v3 artifact info keeps
          # using the workflow token). Sets HTTP and BODY. A failure never stops the workflow:
          # it is written to the evidence as an error.
          api_fetch() {
            if [ -z "${PAT:-}" ]; then
              HTTP=000
              BODY='{"error":"the PAT secret is empty or not available to this job"}'
              return 0
            fi
            out=$(curl --silent --show-error -w '\n%{http_code}' -X GET "$URL$1" \
              -H "Authorization: Bearer $PAT" \
              -H 'Content-Type: application/json') || out=$(printf 'curl failed\n000')
            HTTP=$(printf '%s' "$out" | tail -n1)
            BODY=$(printf '%s' "$out" | sed '$d')
          }

          # api_error <file> <heading> <path>: write the failed call to the evidence
          api_error() {
            {
              if [ -n "$2" ]; then echo "### $2"; echo; fi
              echo "**ERROR: HTTP $HTTP** from \`$3\`"
              echo
              echo '```json'
              printf '%s' "$BODY" | jq . 2>/dev/null || printf '%s\n' "$BODY"
              echo '```'
              echo
            } >> "$1"
          }

          # api_section <file> <heading> <path>: raw JSON response of a v4 call
          api_section() {
            api_fetch "$3"
            case "$HTTP" in
              2??) { echo "### $2"; echo; echo '```json'; printf '%s' "$BODY" | jq . 2>/dev/null || printf '%s\n' "$BODY"; echo '```'; echo; } >> "$1" ;;
              *) api_error "$1" "$2" "$3" ;;
            esac
          }

          # junit_summary <file>: markdown summary table of a test result file. Understands the
          # Jenkins JUnit plugin format (<result><suites><suite><cases><case>, which is what CloudBees CI
          # publishes) and standard JUnit XML (<testsuite tests= failures= errors= skipped= time=>).
          # Fails if no suite is found.
          junit_summary() {
            awk '
              function attr(tag, n,   re) {
                re = " " n "=\"[^\"]*\""
                if (match(tag, re)) return substr(tag, RSTART + length(n) + 3, RLENGTH - length(n) - 4)
                return ""
              }
              function text(l, tag) {
                sub("^<" tag ">", "", l); sub("</" tag ">.*$", "", l)
                gsub(/&lt;/, "<", l); gsub(/&gt;/, ">", l); gsub(/&quot;/, "\"", l); gsub(/&amp;/, "\\&", l)
                gsub(/\|/, "\\|", l)
                return l
              }
              function fmt(x) {
                x = int(x)
                if (x >= 3600) return int(x / 3600) "h " int((x % 3600) / 60) "m " (x % 60) "s"
                if (x >= 60) return int(x / 60) "m " (x % 60) "s"
                return x "s"
              }
              function emit(name, t, fail, sk, tm,   pass) {
                pass = t - fail - sk; if (pass < 0) pass = 0
                printf "| %s | %d | %d | %d | %d | %s |\n", name, t, pass, fail, sk, fmt(tm)
                T += t; P += pass; F += fail; S += sk; TM += tm; n++
              }
              function line(l) {
                sub(/^[ \t]+/, "", l); sub(/[ \t]+$/, "", l)
                # Jenkins JUnit plugin format
                if (l == "<suite>") { inS = 1; incases = 0; sname = ""; stime = ""; sdur = ""; tot = 0; fail = 0; skip = 0; return }
                if (inS && l == "<cases>") { incases = 1; return }
                if (inS && !incases) {
                  if (l ~ /^<name>/) sname = text(l, "name")
                  else if (l ~ /^<time>/) stime = text(l, "time")
                  else if (l ~ /^<duration>/) sdur = text(l, "duration")
                  return
                }
                if (inS && incases) {
                  if (l == "<case>") tot++
                  else if (l ~ /^<isProperFailure>true</) fail++
                  else if (l ~ /^<skipped>true</) skip++
                  else if (l == "</suite>") { emit(sname, tot, fail, skip, (stime != "" ? stime : sdur) + 0); inS = 0 }
                  return
                }
                # standard JUnit XML
                if (l ~ /^<testsuite /) {
                  nm = attr(l, "name"); gsub(/\|/, "\\|", nm)
                  emit(nm, attr(l, "tests") + 0, attr(l, "failures") + attr(l, "errors"), attr(l, "skipped") + 0, attr(l, "time") + 0)
                }
              }
              BEGIN {
                print "| Test suite name | Total test cases | Total cases passed | Total cases failed | Total cases skipped | Run time |"
                print "|---|---|---|---|---|---|"
              }
              { gsub(/\r/, ""); gsub(/></, ">\n<"); k = split($0, parts, "\n"); for (i = 1; i <= k; i++) line(parts[i]) }
              END {
                if (n == 0) exit 3
                if (n > 1) printf "| **Total** | **%d** | **%d** | **%d** | **%d** | **%s** |\n", T, P, F, S, fmt(TM)
              }' "$1"
          }

          # tests_section <file> <heading> <path>: link to the run's Test Results in Unify, then for
          # each test result file (presigned URL returned by the API) its download link and a summary
          # table. The file is downloaded without an Authorization header (the URL carries the signature).
          tests_section() {
            {
              echo "### $2"
              echo
              if [ -n "${TEST_URL:-}" ]; then echo "- Test results in Unify: [open the run's Test Results]($TEST_URL)"; fi
            } >> "$1"
            api_fetch "$3"
            case "$HTTP" in
              2??) ;;
              *) echo >> "$1"; api_error "$1" "" "$3"; return 0 ;;
            esac
            FILES=$(printf '%s' "$BODY" | jq -r '(.files // [])[] | [.fileName, .downloadUrl, (.uploadedAt // "n/a"), (.expiresAt // "n/a")] | @tsv')
            if [ -z "$FILES" ]; then
              { echo "- Test result files: none"; echo; } >> "$1"
              return 0
            fi
            printf '%s\n' "$FILES" | while IFS="$(printf '\t')" read -r FN DU UP EXP; do
              echo "- Test result file: [download]($DU) (uploaded $UP, link expires $EXP)"
              echo
              if curl --silent --show-error --fail -m 120 -o /tmp/tr.gz "$DU" 2>/dev/null \
                 && gunzip -c /tmp/tr.gz > /tmp/tr.out 2>/dev/null \
                 && junit_summary /tmp/tr.out > /tmp/tr.md 2>/dev/null; then
                cat /tmp/tr.md
              else
                echo "_Summary not available: the file could not be downloaded or is not in a recognised test result format._"
              fi
              echo
            done >> "$1"
          }

          # security_section <file> <heading> <path>: summary by severity plus a table of the findings
          # (first 50, most severe first) built from the security-results response.
          SEC_FILTER='
            def esc: tostring | gsub("\\|"; "\\|") | gsub("[\r\n]+"; " ");
            def srank: ({"critical":0,"high":1,"medium":2,"low":3}[.] // 4);
            (.findings // []) as $f
            | ($f | length) as $n
            | if $n == 0 then "No security findings for this run."
              else
                ($f | map(.severity // "unknown" | ascii_downcase)) as $sev
                | "- Findings: \($n) (active: \([$f[] | select(.isActive == true)] | length))",
                  "- By severity: \($sev | unique | sort_by(srank) | map(. as $s | "\($s): \($sev | map(select(. == $s)) | length)") | join(", "))",
                  "",
                  "| Severity | Finding | Code | Tool | Category | Active | Remediation | Triage | Scan time |",
                  "|---|---|---|---|---|---|---|---|---|",
                  ($f | sort_by((.severity // "") | ascii_downcase | srank) | .[:50][]
                    | "| \(.severity // "n/a" | esc) | \(.findingName // "n/a" | esc) | \(.findingCode // "n/a" | esc) | \(.toolDisplayName // .toolName // "n/a" | esc) | \(.category // "n/a" | esc) | \(.isActive | if . == null then "n/a" else . end | esc) | \(.remediationStatus // "n/a" | esc) | \(.triageStatus // "n/a" | esc) | \(.scanTime // "n/a" | esc) |"),
                  (if $n > 50 then "", "Showing the 50 most severe of \($n) findings." else empty end)
              end'
          security_section() {
            api_fetch "$3"
            case "$HTTP" in
              2??) ;;
              *) api_error "$1" "$2" "$3"; return 0 ;;
            esac
            {
              echo "### $2"
              echo
              printf '%s' "$BODY" | jq -r "$SEC_FILTER" 2>/dev/null || {
                echo "Could not parse the response:"
                echo '```json'
                printf '%s\n' "$BODY"
                echo '```'
              }
              echo
            } >> "$1"
          }

          while IFS="$(printf '\t')" read -r COMP NAME VERSION LOC DIGEST AID CID; do
            printf '%s' "$AID" | grep -Eq '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$' \
              || { echo "Invalid or missing artifact id for $COMP/$NAME: '$AID'" >&2; exit 1; }
            INFO=$(curl --silent --show-error --fail-with-body \
              -X GET "$URL/v3/artifactinfos/$AID" \
              -H "Authorization: Bearer $JWT" \
              -H 'Content-Type: application/json') || {
                echo "Platform API call failed for artifact $AID: '$INFO'" >&2
                exit 1
              }
            TITLE="$COMP / $NAME $VERSION (artifact $AID)"

            # Labels come from the artifact info (Platform API)
            LABELS=$(printf '%s' "$INFO" | jq -r '
              (.labels // [])
              | (if type=="array" then map(if type=="object" then (.name // tostring) else tostring end) else [tostring] end)
              | if length==0 then "none" else join(", ") end')

            # Labels starting with TSM- are Jira issue keys
            JIRA=$(printf '%s' "$INFO" | jq -r '
              [(.labels // [])[] | strings | select(startswith("TSM-"))]
              | map("[\(.)](https://cloudbees.atlassian.net/browse/\(.))")
              | if length==0 then "none" else join(", ") end')

            # The run that published the artifact
            PUB_COMPONENT=$(printf '%s' "$INFO" | jq -r '.publishedBy.componentId // empty')
            PUB_RUN=$(printf '%s' "$INFO" | jq -r '.publishedBy.runId // empty')
            PUB_AUTOMATION=$(printf '%s' "$INFO" | jq -r '.publishedBy.automationId // empty')
            PUB_ATTEMPT=$(printf '%s' "$INFO" | jq -r '.publishedBy.runAttempt // empty')
            PUB_ORG=$(printf '%s' "$INFO" | jq -r '.publishedBy.organizationId // .organizationId // empty')

            # Link to the run's Test Results in Unify
            TEST_URL=""
            if [ -n "$PUB_COMPONENT" ] && [ -n "$PUB_RUN" ] && [ -n "$PUB_AUTOMATION" ] && [ -n "$PUB_ORG" ]; then
              TEST_URL="$UNIFY_UI_URL/$PUB_ORG/components/$PUB_COMPONENT/runs/$PUB_AUTOMATION/$PUB_RUN/${PUB_ATTEMPT:-1}/logs?componentId=$PUB_COMPONENT&workflowId=$PUB_AUTOMATION&organizationId=$PUB_ORG&job=Run+tests&activeTab=Test+Results"
            fi

            {
              echo "### $COMP"
              echo
              echo "- Artifact: $NAME"
              echo "- Version: $VERSION"
              echo "- Location: $LOC"
              echo "- Digest: $DIGEST"
              echo "- Artifact ID: $AID"
              echo "- Component ID: $CID"
              echo "- Published by run: ${PUB_RUN:-n/a} (component ${PUB_COMPONENT:-n/a})"
              echo "- Labels: $LABELS"
              echo "- Jira issues: $JIRA"
              echo
            } >> /tmp/evidence.md

            {
              echo "### $TITLE"
              echo
              echo '```json'
              printf '%s' "$INFO" | jq . 2>/dev/null || printf '%s\n' "$INFO"
              echo '```'
              echo
            } >> /tmp/raw.md

            if [ -n "$PUB_COMPONENT" ] && [ -n "$PUB_RUN" ]; then
              tests_section /tmp/tests.md "$TITLE" "/v4/components/$PUB_COMPONENT/runs/$PUB_RUN/test-results"
              security_section /tmp/security.md "$TITLE" "/v4/components/$PUB_COMPONENT/runs/$PUB_RUN/security-results"
            else
              for f in /tmp/tests.md /tmp/security.md; do
                { echo "### $TITLE"; echo; echo "**Not available**: the artifact info has no publishedBy.componentId / publishedBy.runId."; echo; } >> "$f"
              done
            fi
          done < /tmp/artifacts.tsv

          cp /tmp/evidence.md "$CLOUDBEES_OUTPUTS/evidence"
          cp /tmp/raw.md "$CLOUDBEES_OUTPUTS/raw"
          cp /tmp/tests.md "$CLOUDBEES_OUTPUTS/tests"
          cp /tmp/security.md "$CLOUDBEES_OUTPUTS/security"

      - name: Publish evidence - artifacts and labels
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.evidence }}

      - name: Publish evidence - raw artifact info
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.raw }}

      - name: Publish evidence - test results
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.tests }}

      - name: Publish evidence - security results
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.security }}

  release-approval:
    needs: evidence
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    timeout-minutes: 1440
    with:
      approvers: ${{ inputs.approver }}
      disallowLaunchByUser: true
      instructions: |
        Review the evidence published by the Evidence stage (Run > Jobs > Evidence):
        the artifact details, labels and Jira issues, test results and security results.
        Approve to deploy this release to production, or reject to stop it.

  deploy-production:
    needs: release-approval
    environment: pro-lola
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
