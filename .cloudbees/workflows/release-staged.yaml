# Application workflow: .cloudbees/workflows/release-staged.yaml
# Staged release workflow (run from an application release; receives the release manifest):
#   Evidence -> Approval -> Production
# Component agnostic: every component and artifact flagged deploy=true in the manifest
# is listed in the evidence, and the deployer workflow deploys whatever the manifest holds.
# Requires the application's deployer workflow (.cloudbees/workflows/deployer.yaml),
# which Unify can generate for you from Applications > Workflows.
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: release-staged

on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: Release manifest (JSON) with the artifact versions to deploy
      approver:
        type: string
        required: true
        description: Release manager who approves the deployment (user ID or e-mail address)
  workflow_call:
    inputs:
      manifest:
        type: string
        required: true
        description: Release manifest (JSON) with the artifact versions to deploy
      approver:
        type: string
        required: true
        description: Release manager who approves the deployment (user ID or e-mail address)

metadata:
  stages/v1alpha1:
    - name: Evidence
      jobs:
        - evidence
    - name: Approval
      jobs:
        - release-approval
    - name: Production
      jobs:
        - deploy-production

jobs:
  evidence:
    steps:
      - id: collect
        name: Build the evidence from the release manifest
        # Image with curl and jq (the one the get-artifact-details action uses)
        uses: docker://public.ecr.aws/l7o7z1g8/actions/cb-utils:main-0.1.59
        shell: sh
        env:
          MANIFEST: ${{ inputs.manifest }}
          JWT: ${{ cloudbees.api.token }}
          URL: ${{ cloudbees.api.url }}
        run: |
          set -eu
          printf '%s' "$MANIFEST" > /tmp/manifest.json
          jq -e . /tmp/manifest.json >/dev/null || { echo "The manifest is not valid JSON" >&2; exit 1; }

          # Manifest shape: { "<component>": { "deploy": bool, "id": "<component id>",
          #                                    "<artifact>": { "deploy": bool, "id", "name", "version", "url", "digest" } } }
          jq -r 'to_entries[]
            | select(.value | type == "object" and .deploy == true)
            | .key as $comp | .value as $c
            | $c | to_entries[]
            | select(.value | type == "object")
            | select(.value.deploy != false)
            | .key as $k | .value as $a
            | [$comp, ($a.name // $k), ($a.version // "n/a"), ($a.url // "n/a"),
               ($a.digest // "n/a"), ($a.id // "n/a"), ($c.id // "n/a")] | @tsv' /tmp/manifest.json > /tmp/artifacts.tsv

          COUNT=$(wc -l < /tmp/artifacts.tsv | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "The manifest has no artifact flagged deploy=true" >&2
            exit 1
          fi

          {
            echo "## Artifacts to deploy: $COUNT"
            echo
          } > /tmp/evidence.md

          {
            echo "## Raw artifact info (Platform API /v3/artifactinfos)"
            echo
          } > /tmp/raw.md

          while IFS="$(printf '\t')" read -r COMP NAME VERSION LOC DIGEST AID CID; do
            # Labels come from the artifact info (Platform API)
            printf '%s' "$AID" | grep -Eq '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$' \
              || { echo "Invalid or missing artifact id for $COMP/$NAME: '$AID'" >&2; exit 1; }
            INFO=$(curl --silent --show-error --fail-with-body \
              -X GET "$URL/v3/artifactinfos/$AID" \
              -H "Authorization: Bearer $JWT" \
              -H 'Content-Type: application/json') || {
                echo "Platform API call failed for artifact $AID: '$INFO'" >&2
                exit 1
              }
            {
              echo "### $COMP / $NAME $VERSION (artifact $AID)"
              echo
              echo '```json'
              printf '%s' "$INFO" | jq . 2>/dev/null || printf '%s\n' "$INFO"
              echo '```'
              echo
            } >> /tmp/raw.md
            LABELS=$(printf '%s' "$INFO" | jq -r '
              (.labels // [])
              | (if type=="array" then map(if type=="object" then (.name // tostring) else tostring end) else [tostring] end)
              | if length==0 then "none" else join(", ") end')
            {
              echo "### $COMP"
              echo
              echo "- Artifact: $NAME"
              echo "- Version: $VERSION"
              echo "- Location: $LOC"
              echo "- Digest: $DIGEST"
              echo "- Artifact ID: $AID"
              echo "- Component ID: $CID"
              echo "- Labels: $LABELS"
              echo
            } >> /tmp/evidence.md
          done < /tmp/artifacts.tsv

          cp /tmp/evidence.md "$CLOUDBEES_OUTPUTS/evidence"
          cp /tmp/raw.md "$CLOUDBEES_OUTPUTS/raw"

      - name: Publish evidence - artifacts and labels
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.evidence }}

      - name: Publish evidence - raw artifact info
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.raw }}

  release-approval:
    needs: evidence
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    timeout-minutes: 1440
    with:
      approvers: ${{ inputs.approver }}
      disallowLaunchByUser: true
      instructions: |
        Review the evidence published by the Evidence stage (Run > Jobs > Evidence):
        the artifact details and labels.
        Approve to deploy this release to production, or reject to stop it.

  deploy-production:
    needs: release-approval
    environment: pro-lola
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
