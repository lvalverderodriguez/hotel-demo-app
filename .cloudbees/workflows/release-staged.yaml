# Application workflow: .cloudbees/workflows/release-staged.yaml
# Staged release workflow (run from an application release; receives the release manifest):
#   Evidence -> Approval -> Production
# Component agnostic: every component and artifact flagged deploy=true in the manifest
# is listed in the evidence, and the deployer workflow deploys whatever the manifest holds.
# Requires the application's deployer workflow (.cloudbees/workflows/deployer.yaml),
# which Unify can generate for you from Applications > Workflows.
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: release-staged

on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: Release manifest (JSON) with the artifact versions to deploy
      approver:
        type: string
        required: true
        description: Release manager who approves the deployment (user ID or e-mail address)
  workflow_call:
    inputs:
      manifest:
        type: string
        required: true
        description: Release manifest (JSON) with the artifact versions to deploy
      approver:
        type: string
        required: true
        description: Release manager who approves the deployment (user ID or e-mail address)

metadata:
  stages/v1alpha1:
    - name: Evidence
      jobs:
        - evidence
    - name: Approval
      jobs:
        - release-approval
    - name: Production
      jobs:
        - deploy-production

jobs:
  evidence:
    # The PAT secret lives in this environment, so the job must run in it to read it
    environment: pro-lola
    steps:
      - id: collect
        name: Build the evidence from the release manifest
        # Image with curl and jq (the one the get-artifact-details action uses)
        uses: docker://public.ecr.aws/l7o7z1g8/actions/cb-utils:main-0.1.59
        shell: sh
        env:
          MANIFEST: ${{ inputs.manifest }}
          JWT: ${{ cloudbees.api.token }}
          URL: ${{ cloudbees.api.url }}
          # Personal access token for the v4 API (secret of the pro-lola environment)
          PAT: ${{ secrets.PAT }}
        run: |
          set -eu
          printf '%s' "$MANIFEST" > /tmp/manifest.json
          jq -e . /tmp/manifest.json >/dev/null || { echo "The manifest is not valid JSON" >&2; exit 1; }

          # Manifest shape: { "<component>": { "deploy": bool, "id": "<component id>",
          #                                    "<artifact>": { "deploy": bool, "id", "name", "version", "url", "digest" } } }
          jq -r 'to_entries[]
            | select(.value | type == "object" and .deploy == true)
            | .key as $comp | .value as $c
            | $c | to_entries[]
            | select(.value | type == "object")
            | select(.value.deploy != false)
            | .key as $k | .value as $a
            | [$comp, ($a.name // $k), ($a.version // "n/a"), ($a.url // "n/a"),
               ($a.digest // "n/a"), ($a.id // "n/a"), ($c.id // "n/a")] | @tsv' /tmp/manifest.json > /tmp/artifacts.tsv

          COUNT=$(wc -l < /tmp/artifacts.tsv | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "The manifest has no artifact flagged deploy=true" >&2
            exit 1
          fi

          echo "## Artifacts to deploy: $COUNT" > /tmp/evidence.md
          echo >> /tmp/evidence.md
          echo "## Raw artifact info (Platform API /v3/artifactinfos)" > /tmp/raw.md
          echo >> /tmp/raw.md
          echo "## Test results of the publishing runs (Platform API v4)" > /tmp/tests.md
          echo >> /tmp/tests.md
          echo "## Security results of the publishing runs (Platform API v4)" > /tmp/security.md
          echo >> /tmp/security.md

          # api_section <file> <heading> <path>: GET a v4 path authenticated with the PAT and append
          # the response as a JSON block. A failed call is written to the evidence as an error,
          # it does not stop the workflow. (The v3 artifact info above keeps using the workflow token.)
          api_section() {
            if [ -z "${PAT:-}" ]; then
              out=$(printf '{"error":"the PAT secret is empty or not available to this job"}\n000')
            else
              out=$(curl --silent --show-error -w '\n%{http_code}' -X GET "$URL$3" \
                -H "Authorization: Bearer $PAT" \
                -H 'Content-Type: application/json') || out=$(printf 'curl failed\n000')
            fi
            HTTP=$(printf '%s' "$out" | tail -n1)
            BODY=$(printf '%s' "$out" | sed '$d')
            {
              echo "### $2"
              echo
              case "$HTTP" in
                2??) ;;
                *) echo "**ERROR: HTTP $HTTP** from \`$3\`"; echo ;;
              esac
              echo '```json'
              printf '%s' "$BODY" | jq . 2>/dev/null || printf '%s\n' "$BODY"
              echo '```'
              echo
            } >> "$1"
          }

          while IFS="$(printf '\t')" read -r COMP NAME VERSION LOC DIGEST AID CID; do
            printf '%s' "$AID" | grep -Eq '^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$' \
              || { echo "Invalid or missing artifact id for $COMP/$NAME: '$AID'" >&2; exit 1; }
            INFO=$(curl --silent --show-error --fail-with-body \
              -X GET "$URL/v3/artifactinfos/$AID" \
              -H "Authorization: Bearer $JWT" \
              -H 'Content-Type: application/json') || {
                echo "Platform API call failed for artifact $AID: '$INFO'" >&2
                exit 1
              }
            TITLE="$COMP / $NAME $VERSION (artifact $AID)"

            # Labels come from the artifact info (Platform API)
            LABELS=$(printf '%s' "$INFO" | jq -r '
              (.labels // [])
              | (if type=="array" then map(if type=="object" then (.name // tostring) else tostring end) else [tostring] end)
              | if length==0 then "none" else join(", ") end')

            # Labels starting with TSM- are Jira issue keys
            JIRA=$(printf '%s' "$INFO" | jq -r '
              [(.labels // [])[] | strings | select(startswith("TSM-"))]
              | map("[\(.)](https://cloudbees.atlassian.net/browse/\(.))")
              | if length==0 then "none" else join(", ") end')

            # The run that published the artifact
            PUB_COMPONENT=$(printf '%s' "$INFO" | jq -r '.publishedBy.componentId // empty')
            PUB_RUN=$(printf '%s' "$INFO" | jq -r '.publishedBy.runId // empty')

            {
              echo "### $COMP"
              echo
              echo "- Artifact: $NAME"
              echo "- Version: $VERSION"
              echo "- Location: $LOC"
              echo "- Digest: $DIGEST"
              echo "- Artifact ID: $AID"
              echo "- Component ID: $CID"
              echo "- Published by run: ${PUB_RUN:-n/a} (component ${PUB_COMPONENT:-n/a})"
              echo "- Labels: $LABELS"
              echo "- Jira issues: $JIRA"
              echo
            } >> /tmp/evidence.md

            {
              echo "### $TITLE"
              echo
              echo '```json'
              printf '%s' "$INFO" | jq . 2>/dev/null || printf '%s\n' "$INFO"
              echo '```'
              echo
            } >> /tmp/raw.md

            if [ -n "$PUB_COMPONENT" ] && [ -n "$PUB_RUN" ]; then
              api_section /tmp/tests.md "$TITLE" "/v4/components/$PUB_COMPONENT/runs/$PUB_RUN/test-results"
              api_section /tmp/security.md "$TITLE" "/v4/components/$PUB_COMPONENT/runs/$PUB_RUN/security-results"
            else
              for f in /tmp/tests.md /tmp/security.md; do
                { echo "### $TITLE"; echo; echo "**Not available**: the artifact info has no publishedBy.componentId / publishedBy.runId."; echo; } >> "$f"
              done
            fi
          done < /tmp/artifacts.tsv

          cp /tmp/evidence.md "$CLOUDBEES_OUTPUTS/evidence"
          cp /tmp/raw.md "$CLOUDBEES_OUTPUTS/raw"
          cp /tmp/tests.md "$CLOUDBEES_OUTPUTS/tests"
          cp /tmp/security.md "$CLOUDBEES_OUTPUTS/security"

      - name: Publish evidence - artifacts and labels
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.evidence }}

      - name: Publish evidence - raw artifact info
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.raw }}

      - name: Publish evidence - test results
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.tests }}

      - name: Publish evidence - security results
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: ${{ steps.collect.outputs.security }}

  release-approval:
    needs: evidence
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    timeout-minutes: 1440
    with:
      approvers: ${{ inputs.approver }}
      disallowLaunchByUser: true
      instructions: |
        Review the evidence published by the Evidence stage (Run > Jobs > Evidence):
        the artifact details, labels and Jira issues, test results and security results.
        Approve to deploy this release to production, or reject to stop it.

  deploy-production:
    needs: release-approval
    environment: pro-lola
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
